# Render Blueprint: one free web service runs the API and serves the built
# React app. Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Set the `sync: false` values (database, passcode, AI key) in the dashboard when asked.
services:
  - type: web
    name: spatial-learning-platform
    runtime: python
    plan: free
    region: ohio            # same region as the Neon database (us-east-2)
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      cd frontend && npm ci && npm run build
    startCommand: >-
      cd backend && alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false          # Neon connection string
      - key: ADMIN_PASSCODE
        sync: false          # passcode for /admin (share it with demo viewers)
      - key: ADMIN_TOKEN_SECRET
        generateValue: true  # keeps admin logins valid across restarts
      - key: CORS_ORIGINS
        value: '[]'          # same origin; nothing cross-site to allow
      # AI tutor: Gemini through its OpenAI-compatible endpoint
      - key: AI_PROVIDER
        value: openai
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: AI_REASONING_EFFORT
        value: none          # fast replies (~1.5 s) for live hints
      - key: AI_API_KEY
        sync: false          # Gemini API key (same as backend/.env)
