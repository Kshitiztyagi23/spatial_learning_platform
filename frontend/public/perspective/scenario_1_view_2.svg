<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>
  <rect width="800" height="500" fill="url(#grid)" rx="12"/>
  
  <!-- Outer Frame -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#2563eb" stroke-width="2" stroke-opacity="0.3" rx="8" />
  
  <!-- Center Badge -->
  <g transform="translate(400, 200)">
    <!-- Perspective Compass Icon -->
    <circle r="60" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-width="2" />
    <polygon points="0,-45 14,0 0,45 -14,0" fill="#2563eb" fill-opacity="0.75" />
    <polygon points="0,-45 0,0 14,0" fill="#2563eb" />
    <circle r="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
  </g>
  
  <!-- Text Labels -->
  <text x="400" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">Scenario 1 — View 2</text>
  <text x="400" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#475569" text-anchor="middle">East Perspective</text>
  <text x="400" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">[Placeholder Image • Replace with your actual perspective picture/render]</text>
</svg>